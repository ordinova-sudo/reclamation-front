@for (product of products; track product.id) {
  <div>
    <h3>{{ product.name | uppercase }}</h3>
    <p>Prix : {{ product.price | currency:'TND' }}</p>
    @if (product.inStock) {
      <button (click)="addToCart(product)">Ajouter</button>
    } @else {
      <span style="color:red">Indisponible</span>
    }
  </div>
}
