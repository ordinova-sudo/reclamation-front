<div class="container">
  <div *ngIf="loading" class="loading">
    Chargement des détails...
  </div>

  <div *ngIf="!loading && !scannerForm.value.modele" class="error">
    Scanner non trouvé
  </div>

  <div *ngIf="!loading && scannerForm.value.modele" class="details-card">
    <div class="header">
      <button class="btn-back" (click)="goBack()">← Retour</button>
      <h1>{{ editMode ? 'Modifier le scanner' : scannerForm.value.marque + ' ' + scannerForm.value.modele }}</h1>
      <button 
        *ngIf="!editMode" 
        class="btn-edit" 
        (click)="toggleEditMode()">
        ✏️ Modifier
      </button>
    </div>

    <form [formGroup]="scannerForm" (ngSubmit)="onSubmit()" class="form-grid">
      
      <div class="form-group">
        <label>Modèle *</label>
        <input 
          type="text" 
          formControlName="modele" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Marque *</label>
        <input 
          type="text" 
          formControlName="marque" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>État *</label>
        <select 
          *ngIf="editMode"
          formControlName="etat">
          <option value="">-- Choisir un état --</option>
          <option *ngFor="let e of etatsScanner" [value]="e">{{ e }}</option>
        </select>
        <input 
          *ngIf="!editMode"
          type="text" 
          [value]="scannerForm.value.etat"
          readonly
          class="readonly">
      </div>

      <div class="form-group">
        <label>Hôpital *</label>
        <input 
          *ngIf="!editMode"
          type="text" 
          formControlName="hopitalNom"
          readonly
          class="readonly">
        <select 
          *ngIf="editMode"
          formControlName="hopital"
          [compareWith]="compareHopitals">
          <option [ngValue]="null">-- Choisir un hôpital --</option>
          <option *ngFor="let h of hopitals" [ngValue]="h">{{ h.nom }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Disponible</label>
        <input 
          *ngIf="!editMode"
          type="text" 
          [value]="scannerForm.value.disponible ? 'Oui' : 'Non'"
          readonly
          class="readonly">
        <label *ngIf="editMode" class="checkbox-label">
          <input type="checkbox" formControlName="disponible">
          <span>✓ Disponible</span>
        </label>
      </div>

      <div *ngIf="editMode" class="button-group">
        <button type="submit" class="btn-save" [disabled]="scannerForm.invalid">
          💾 Enregistrer
        </button>
        <button type="button" class="btn-cancel" (click)="toggleEditMode()">
          ❌ Annuler
        </button>
      </div>

    </form>
  </div>
</div>
