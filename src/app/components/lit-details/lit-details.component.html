<div class="container">
  <div *ngIf="loading" class="loading">
    Chargement des détails...
  </div>

  <div *ngIf="!loading && !litForm.value.numero" class="error">
    Lit non trouvé
  </div>

  <div *ngIf="!loading && litForm.value.numero" class="details-card">
    <div class="header">
      <button class="btn-back" (click)="goBack()">← Retour</button>
      <h1>{{ editMode ? 'Modifier le lit' : 'Lit ' + litForm.value.numero }}</h1>
      <button 
        *ngIf="!editMode" 
        class="btn-edit" 
        (click)="toggleEditMode()">
        ✏️ Modifier
      </button>
    </div>

    <form [formGroup]="litForm" (ngSubmit)="onSubmit()" class="form-grid">
      
      <div class="form-group">
        <label>Numéro *</label>
        <input 
          type="text" 
          formControlName="numero" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Type *</label>
        <select 
          *ngIf="editMode"
          formControlName="type">
          <option value="">-- Choisir un type --</option>
          <option *ngFor="let t of typesLit" [value]="t">{{ t }}</option>
        </select>
        <input 
          *ngIf="!editMode"
          type="text" 
          [value]="litForm.value.type"
          readonly
          class="readonly">
      </div>

      <div class="form-group">
        <label>État *</label>
        <select 
          *ngIf="editMode"
          formControlName="etat">
          <option value="">-- Choisir un état --</option>
          <option *ngFor="let e of etatsLit" [value]="e">{{ e }}</option>
        </select>
        <input 
          *ngIf="!editMode"
          type="text" 
          [value]="litForm.value.etat"
          readonly
          class="readonly">
      </div>

      <div class="form-group">
        <label>Hôpital *</label>
        <input 
          *ngIf="!editMode"
          type="text" 
          formControlName="hopitalNom"
          readonly
          class="readonly">
        <select 
          *ngIf="editMode"
          formControlName="hopital"
          [compareWith]="compareHopitals">
          <option [ngValue]="null">-- Choisir un hôpital --</option>
          <option *ngFor="let h of hopitals" [ngValue]="h">{{ h.nom }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Occupé</label>
        <input 
          *ngIf="!editMode"
          type="text" 
          [value]="litForm.value.estOccupe ? 'Oui' : 'Non'"
          readonly
          class="readonly">
        <label *ngIf="editMode" class="checkbox-label">
          <input type="checkbox" formControlName="estOccupe">
          <span>🔴 Occupé</span>
        </label>
      </div>

      <div *ngIf="editMode" class="button-group">
        <button type="submit" class="btn-save" [disabled]="litForm.invalid">
          💾 Enregistrer
        </button>
        <button type="button" class="btn-cancel" (click)="toggleEditMode()">
          ❌ Annuler
        </button>
      </div>

    </form>
  </div>
</div>
