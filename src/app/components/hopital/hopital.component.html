<div class="container">
  <form [formGroup]="hopitalForm" (ngSubmit)="onSubmit()" class="form-card">
    
    <div class="form-header">
      <div class="header-icon">🏥</div>
      <h2>Création d'un Établissement Hospitalier</h2>
      <p class="subtitle">Veuillez remplir les informations ci-dessous</p>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Nom *</label>
        <input 
          type="text" 
          formControlName="nom"
          placeholder="Nom de l'hôpital">
        <span class="error-message" *ngIf="hopitalForm.get('nom')?.invalid && hopitalForm.get('nom')?.touched">
          Le nom est obligatoire
        </span>
      </div>

      <div class="form-group">
        <label>Gouvernorat *</label>
        <select formControlName="gouvernorat">
          <option value="">-- Choisir un gouvernorat --</option>
          <option *ngFor="let g of gouvernorats" [value]="g">{{ g }}</option>
        </select>
        <span class="error-message" *ngIf="hopitalForm.get('gouvernorat')?.invalid && hopitalForm.get('gouvernorat')?.touched">
          Le gouvernorat est obligatoire
        </span>
      </div>

      <div class="form-group">
        <label>Ville</label>
        <input 
          type="text" 
          formControlName="ville"
          placeholder="Ville">
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <input 
          type="text" 
          formControlName="adresse"
          placeholder="Adresse complète">
      </div>

      <div class="form-group">
        <label>Latitude</label>
        <input 
          type="number" 
          formControlName="latitude"
          placeholder="Ex: 36.8065"
          step="any">
      </div>

      <div class="form-group">
        <label>Longitude</label>
        <input 
          type="number" 
          formControlName="longitude"
          placeholder="Ex: 10.1815"
          step="any">
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input 
          type="text" 
          formControlName="telephone"
          placeholder="+216 XX XXX XXX">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          formControlName="email"
          placeholder="contact@hopital.tn">
      </div>

      <div class="form-group">
        <label>Site Web</label>
        <input 
          type="text" 
          formControlName="siteWeb"
          placeholder="https://www.hopital.tn">
      </div>

      <div class="form-group">
        <label>Heure d'ouverture</label>
        <input 
          type="time" 
          formControlName="heureOuverture">
      </div>

      <div class="form-group">
        <label>Heure de fermeture</label>
        <input 
          type="time" 
          formControlName="heureFermeture">
      </div>

      <div class="form-group">
        <label>Description</label>
        <input 
          type="text" 
          formControlName="description"
          placeholder="Description de l'établissement">
      </div>

      <div class="form-group full-width">
        <label>Type d'établissement *</label>
        <select formControlName="type">
          <option value="">-- Choisir un type --</option>
          <option *ngFor="let type of typesHopital" [value]="type.value">{{ type.label }}</option>
        </select>
        <span class="error-message" *ngIf="hopitalForm.get('type')?.invalid && hopitalForm.get('type')?.touched">
          Le type est obligatoire
        </span>
      </div>

      <div class="form-group full-width">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="urgence">
          <span>⚕️ Service d'urgence disponible (SAMU)</span>
        </label>
      </div>

      <button type="submit" [disabled]="hopitalForm.invalid" class="submit-btn">
        <span *ngIf="!hopitalForm.invalid">✓ Enregistrer l'hôpital</span>
        <span *ngIf="hopitalForm.invalid">⚠️ Veuillez remplir tous les champs obligatoires</span>
      </button>
    </div>

  </form>
</div>
