<div cmlass="container">
<form [formGroup]="hopitalForm" (ngSubmit)="onSubmit()" class="form-grid">
  <h2 class="main-title">Création et administration d’un établissement</h2>
  <div></div>
  <div class="form-group">
    <label>Nom</label>
    <input type="text" formControlName="nom">
  </div>

  <div class="form-group">
    <label>Gouvernorat</label>
    <select formControlName="gouvernorat">
      <option value="">-- Choisir --</option>
      <option *ngFor="let g of gouvernorats" [value]="g">{{ g }}</option>
    </select>
  </div>

  <div class="form-group">
    <label>Ville</label>
    <input type="text" formControlName="ville">
  </div>

  <div class="form-group">
    <label>Adresse</label>
    <input type="text" formControlName="adresse">
  </div>

  <div class="form-group">
    <label>Latitude</label>
    <input type="number" formControlName="latitude">
  </div>

  <div class="form-group">
    <label>Longitude</label>
    <input type="number" formControlName="longitude">
  </div>

  <div class="form-group">
    <label>Téléphone</label>
    <input type="text" formControlName="telephone">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" formControlName="email">
  </div>

  <div class="form-group">
    <label>Site Web</label>
    <input type="text" formControlName="siteWeb">
  </div>

  <div class="form-group">
    <label>Heure ouverture</label>
    <input type="time" formControlName="heureOuverture">
  </div>

  <div class="form-group">
    <label>Heure fermeture</label>
    <input type="time" formControlName="heureFermeture">
  </div>

  <div class="form-group">
    <label>Description</label>
    <input type="text" formControlName="description">
  </div>

  <div class="form-group full-width">
    <label>Type</label>
    <div class="radio-group">
      <label><input type="radio" value="PUBLIC" formControlName="type"> Public</label>
      <label><input type="radio" value="PRIVE" formControlName="type"> Privé</label>
    </div>
  </div>

  <div class="form-group full-width">
    <label>
      <input type="checkbox" formControlName="urgence">
      Service d'urgence (SAMU)
    </label>
  </div>

  <button type="submit" [disabled]="hopitalForm.invalid">
    Enregistrer
  </button>

</form>
</div>
