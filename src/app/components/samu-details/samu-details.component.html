<div class="container">
  <div *ngIf="loading" class="loading">
    Chargement des détails...
  </div>

  <div *ngIf="!loading && !samuForm.value.nom" class="error">
    SAMU non trouvé
  </div>

  <div *ngIf="!loading && samuForm.value.nom" class="details-card">
    <div class="header">
      <button class="btn-back" (click)="goBack()">← Retour</button>
      <h1>{{ editMode ? 'Modifier le SAMU' : samuForm.value.nom }}</h1>
      <button 
        *ngIf="!editMode" 
        class="btn-edit" 
        (click)="toggleEditMode()">
        ✏️ Modifier
      </button>
    </div>

    <form [formGroup]="samuForm" (ngSubmit)="onSubmit()" class="form-grid">
      
      <div class="form-group">
        <label>Nom *</label>
        <input 
          type="text" 
          formControlName="nom" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Gouvernorat *</label>
        <select 
          formControlName="gouvernorat" 
          [disabled]="!editMode"
          [class.readonly]="!editMode">
          <option value="">-- Choisir --</option>
          <option *ngFor="let g of gouvernorats" [value]="g">{{ g }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ville *</label>
        <input 
          type="text" 
          formControlName="ville" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <input 
          type="text" 
          formControlName="adresse" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Latitude</label>
        <input 
          type="number" 
          formControlName="latitude" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Longitude</label>
        <input 
          type="number" 
          formControlName="longitude" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Téléphone *</label>
        <input 
          type="text" 
          formControlName="telephone" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          formControlName="email" 
          [readonly]="!editMode"
          [class.readonly]="!editMode">
      </div>

      <div class="form-group full-width">
        <label>Hôpital *</label>
        <input 
          *ngIf="!editMode"
          type="text" 
          [value]="getHopitalName()"
          readonly
          class="readonly">
        <select 
          *ngIf="editMode"
          formControlName="hopitalId">
          <option value="">-- Choisir un hôpital --</option>
          <option *ngFor="let hopital of hopitals" [value]="hopital.id">{{ hopital.nom }}</option>
        </select>
      </div>

      <div *ngIf="editMode" class="button-group">
        <button type="submit" class="btn-save" [disabled]="samuForm.invalid">
          💾 Enregistrer
        </button>
        <button type="button" class="btn-cancel" (click)="toggleEditMode()">
          ❌ Annuler
        </button>
      </div>

    </form>
  </div>
</div>
