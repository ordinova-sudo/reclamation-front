<form [formGroup]="userForm" (ngSubmit)="onSubmit()">

<div>
    <label>Nom :</label>
    <input type="text" formControlName="lastName">
    <div *ngIf="userForm.get('lastName')?.touched && userForm.get('lastName')?.invalid" style="color:red">
      Nom requis
    </div>
  </div>
<div>
    <label>Prénom :</label>
    <input type="text" formControlName="firstName">
    <div *ngIf="userForm.get('firstName')?.touched && userForm.get('firstName')?.invalid" style="color:red">
      Prénom requis
    </div>
  </div>
  <div>
    <label>Email :</label>
    <input type="email" formControlName="email">
    <div *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid" style="color:red">
      <div *ngIf="userForm.get('email')?.errors?.['required']">Email requis</div>
      <div *ngIf="userForm.get('email')?.errors?.['email']">Email invalide</div>
    </div>
  </div>
  <div>
    <label>Mot de passe :</label>
    <input type="text" formControlName="password">
    <div *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid" style="color:red">
      Prénom requis
    </div>
  </div>
  
  <button type="submit" [disabled]="userForm.invalid">Envoyer</button>
</form>
